case_catalog:
  - case_id: availability-failover
    source_test_path: tests/test_provider_portfolio_fixtures.py
    source_test_symbol: test_failure_classification_keeps_failover_repair_block_and_stop_distinct
    failure_class: RATE_LIMIT
    expected_disposition: AVAILABILITY_FAILOVER
    provider_switch_allowed: true
    same_route_repair_allowed: false
    terminal: false
  - case_id: quality-repair-then-escalation
    source_test_path: tests/test_provider_portfolio_fixtures.py
    source_test_symbol: test_failure_classification_keeps_failover_repair_block_and_stop_distinct
    failure_class: QUALITY_REJECTED
    expected_disposition: SAME_ROUTE_REPAIR_THEN_ESCALATE
    provider_switch_allowed: true
    same_route_repair_allowed: true
    stronger_route_escalation_allowed: true
    terminal: false
  - case_id: policy-block-no-provider-bypass
    source_test_path: tests/test_provider_portfolio_fixtures.py
    source_test_symbol: test_failure_classification_keeps_failover_repair_block_and_stop_distinct
    failure_class: DATA_POLICY_DENIED
    expected_disposition: BLOCK_NO_PROVIDER_BYPASS
    provider_switch_allowed: false
    terminal: true
  - case_id: cancellation-before-dispatch-and-before-application
    source_test_path: tests/test_development_loop.py
    source_test_symbol:
      - test_cancellation_before_worker_call_preserves_candidate
      - test_cancellation_after_worker_discards_unapplied_patch
    expected_terminal_code: CANCELLED_BY_CALLER
    candidate_mutation_allowed: false
    terminal: true
  - case_id: repeated-or-two-cycle-no-progress-stop
    source_test_path: tests/test_development_loop.py
    source_test_symbol:
      - test_repeated_fingerprint_stops_without_attempt_number_escape
      - test_two_distinct_no_progress_cycles_stop_even_without_recurrence
    expected_terminal_codes:
      - STOPPED_NO_PROGRESS_REPEATED_FINGERPRINT
      - STOPPED_NO_PROGRESS_TWO_CYCLES
    provider_switch_allowed: false
    terminal: true
  - case_id: affected-module-isolation
    source_test_path: tests/test_p14h_multi_stack_e2e.py
    source_test_symbol: test_ambiguous_blueprint_out_of_scope_patch_and_invented_milestone_block
    expected_rule: stop_affected_output_pause_dependents_preserve_unrelated_evidence
    machine_lifecycle_status_added: false
    target_mutation_allowed: false
  - case_id: rollback-plan-remains-non-executing
    source_test_path: tests/test_local_git_orchestrator.py
    source_test_symbol: test_records_one_isolated_local_branch_and_commit
    expected_rollback_plan_authorized: false
    rollback_execution_allowed: false
    cleanup_execution_allowed: false
  - case_id: hard-floors-before-total-economics
    source_test_path: tests/test_provider_portfolio_fixtures.py
    source_test_symbol: test_router_applies_hard_floors_before_integer_economics_deterministically
    expected_rule: capability_safety_data_quality_authorization_and_preconditions_precede_cost
    cheaper_unqualified_route_selectable: false

