activation_gates:
  - a separately authorized P15C live execution lifecycle names this exact packet-set commit
  - canonical tool-system main and the private target packet remain unchanged or are re-frozen
  - the private execution policy exists, validates, is enabled, is unexpired, and does not exceed 20 USD
  - the private usage ledger proves sufficient remaining shared budget
  - the credential reference exists and is permission-valid without publishing or logging its value
  - the selected provider is funded and currently available
  - the selected provider data policy is explicitly accepted for the exact private repository allowlist
  - provider transfer of the private repository is explicitly authorized
  - cancellation, timeout, token, attempt, cost, retry, redaction, and no-progress controls are implemented and validated
  - provider tools, provider web search, target mutation, production, cleanup, and rollback remain disabled
