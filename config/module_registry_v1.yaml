- module_id: ai-worker-runtime
  module_version: 2.0.0
  role: provide the provider-neutral worker, deterministic fixtures, generic default-disabled exact-route execution guard, bounded P14C adapter, and source-sealed default-off P15 API-backup runtime. Preserve the accepted P14C proof and all source-seal, owner-only input, budget, expiry, authorization, transfer, retry, cancellation, reservation, audit, and redaction controls. The generic worker route selector has no credential or transport input, returns API_DISABLED without explicit API mode, chooses at most one externally named enabled and declared-available provider/model, and feeds a guard that rejects request or runtime route drift before invocation. Policy schema 4 reads provider priority and requested model identifiers only from repository-external settings, rejects disabled API mode before credential resolution, permits only the public deterministic fixture, never loads a private target, and stops after one successful route. Disabled, unconfigured, zero-budget, missing-credential, invalid-key, unfunded, moving-alias, or availability-failed providers do not make another enabled eligible route fail. Local policy, data-transfer, hard-budget, cancellation, source-integrity, and response-integrity failures remain non-bypassable. Legacy schemas 1 and 2 preserve their exact two-case matrix behavior; schema 3 preserves the direct-TLS single-provider path. Schema 4 keeps direct verified TLS as default and adds only explicit owner-only loopback CONNECT with no proxy credentials, environment activation, redirect support, or endpoint disclosure. All three adapters retain fixed verified TLS surfaces and injected fake-I/O coverage. No provider execution, stage acceptance, target access, production, cleanup, or rollback occurs in this contract package.
  owner: ai-worker-runtime
  public_interface_refs:
