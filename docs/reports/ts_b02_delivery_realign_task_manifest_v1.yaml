write_mode: pull_request
verification:
  commands:
  - python -m pytest -q
  - python -m tool_system.cli.validate_active_gates tests/fixtures/manifest_validation/strict_active_gates_v1.yaml
  - python -m tool_system.cli.validate_process_authority config/process_authority_v1.yaml
  - python -m tool_system.cli.validate_module_registry config/module_registry_v1.yaml
    --require-current-authority
  - python -m tool_system.cli.validate_repo_manifest REPO_MANIFEST.md
  pass_conditions:
  - Exactly the three declared planning files are added; existing files and historical
    evidence are unchanged.
  - The delivery endpoint requires a real isolated code-change, independent validation,
    bounded termination and complete cleanup; reports alone cannot satisfy it.
  - Direct dependency reads, implementation, ordinary repair and validation are grouped
    within a subsequently approved component boundary.
  - The selected PID1/kernel/MAC engineering proposal and deployment/runtime permissions
    are explicit pending decisions, not implied grants.
  - Existing contracts, no-core six stages, absolute deadlines, cleanup limits, trust
    boundary and all retained stopped terminals are preserved.
  - Manifest fields match the read schema by static review, explicit pair structure
    and scope checks pass; unchanged Hosted verify succeeds for the actual PR head.
  - Publish one Draft PR and stop; no merge, Ready transition, deployment, live worker
    or follow-on execution.
rollback:
  method: manual_review
  reference: Leave or close the unmerged Draft PR only under the applicable user decision;
    no history or branch deletion.
approval:
  required: true
  approved_by: user
  approval_source: 'Current conversation: user 同意 to delivery-arrangement correction;
    this planning-only three-file task and Draft publication do not grant source,
    host, runtime, merge or deployment authority.'
  approved_at: 2026-09-16; exact user-message time unavailable
