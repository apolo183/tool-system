design:
  capture: Nonblocking pipes with selector; bounded bytes, no full-output communicate;
    decode only bounded successful data. Unsupported pipe readiness fails closed.
  cleanup: Close read descriptors, kill only direct child if still running, wait at
    most 1 second; timeout does not prove descendants cleanup.
  tests: Inert local Python fixture children only; no Codex/provider or real target;
    adapters remain out of scope.
  contract: KEEP existing formal contract and module registry; result shape and public
    inputs unchanged.
