    scope: Close the fixture-only patch-test-repair-review link without entering durable Git orchestration or expanding external authority.
bounded_closure:
  frozen_before_execution:
    task_identity: P14F-DEVELOPMENT-LOOP-LIFECYCLE-v1
    baseline_commit: 0b5110a2eea79ebde650e1088b787c781ddab171
    baseline_tree: 4041e15eca07cbbd7f215cc2706a2709b88f71ea
    allowed_scope: exact_20_paths_listed_below
    acceptance_set:
      - development-loop 1.0.0 and development-loop-api 1.0.0 are registered as one replaceable natural owner with no static module dependency or external side effect
      - the public API accepts a frozen contract, in-memory fixture files, injected worker validator and two reviewers, finite limits, and optional caller-persisted resume state
      - add replace and delete patches are atomic and require exact allowed paths and content SHA preconditions
      - validator results must exactly match the frozen validation set and satisfied acceptance or review violations cannot expand the frozen acceptance set
      - failed validation diagnostics and blockers feed the next bounded fixture-worker cycle while all call cycle patch time and cost budgets remain finite
      - recurrence fingerprints exclude attempt number timestamps receipts PR metadata and status text and repeated or two-cycle non-progress states terminate
      - a candidate seals only after all frozen acceptance validation and independent reviews pass and stale evidence cannot reopen it
      - returned cycle state is canonical caller-persistable evidence while this module performs zero filesystem Git command network provider credential database downstream production cleanup or rollback operations
      - the sole descriptive project-state owner records P14F accepted and makes P14G the unauthorized next stage with all authorization boundaries false
      - blueprint stable principles P14E source provider paths repository controller target adapter and downstream repositories remain unchanged
    validation_set:
      - focused development-loop module-registry module-contract import-graph repository-manifest and phase-state tests
      - full pytest suite
      - task-manifest change-plan process-authority module-registry and repository-manifest validators
      - source compilation whitespace exact-scope and forbidden-diff checks
    terminal_predicate: all frozen acceptance and validation items pass, one commit and one Draft PR are published, hosted CI succeeds, the unchanged exact-scope PR is moved to Ready and squash-merged, the feature branch is retained, canonical main records P14F accepted, and execution stops with P14G unauthorized
    finite_budgets:
      implementation_cycles: 2
      repair_cycles: 1
      review_cycles: 1
      wall_clock_hours: 8
      real_downstream_repository_accesses: 0
      credential_value_accesses: 0
      provider_invocations: 0
      development_loop_external_operations: 0
  per_cycle_state:
    - candidate_tree
    - acceptance_digest
    - blocker_set
    - satisfied_acceptance_items
    - validation_results
    - material_evidence
    - attempt_number
  recurrence_fingerprint:
    - task_identity
    - candidate_tree
    - acceptance_digest
    - blocker_set
    - validation_results
  recurrence_fingerprint_excludes:
    - attempt_number
    - timestamps
    - receipts
    - pull_request_metadata
    - status_text
