verification:
  commands:
    - git diff --check
    - PYTHONPATH=src PYTHONDONTWRITEBYTECODE=1 python -m compileall -q src/tool_system tests
    - PYTHONPATH=src PYTHONDONTWRITEBYTECODE=1 python -m pytest -q tests/test_ai_worker_live_provider.py tests/test_p14c_execution_contract.py tests/test_phase_alignment.py tests/test_module_registry.py tests/test_module_contracts.py
    - PYTHONPATH=src PYTHONDONTWRITEBYTECODE=1 python -m pytest -q
    - PYTHONPATH=src python -m tool_system.cli.validate_task_manifest examples/task_manifests/tool_system_p14c_qwen_auth_diagnostics_v1.yaml
    - PYTHONPATH=src python -m tool_system.cli.validate_change_plan examples/change_plans/tool_system_p14c_qwen_auth_diagnostics_v1.yaml
    - PYTHONPATH=src python -m tool_system.cli.validate_process_authority config/process_authority_v1.yaml
    - PYTHONPATH=src python -m tool_system.cli.validate_module_registry config/module_registry_v1.yaml --require-current-authority
    - PYTHONPATH=src python -m tool_system.cli.validate_repo_manifest REPO_MANIFEST.md
    - PYTHONPATH=src PYTHONDONTWRITEBYTECODE=1 python -B -m tool_system.ai_worker.live_evidence --validate-packet-only
  pass_conditions:
    - exact 12-file closed scope and zero diff under every forbidden path
    - 401 and 403 fake responses produce distinct stable classes without provider response detail leakage
    - whitespace credential fixtures fail before fake transport without exposing the values
    - focused tests, full tests, all current validators, source compilation, packet-only zero-I/O evidence, and diff checks pass
    - no real GitHub approval read or write, credential-value access, provider call, downstream operation, production operation, cleanup, rollback, or branch deletion occurs
