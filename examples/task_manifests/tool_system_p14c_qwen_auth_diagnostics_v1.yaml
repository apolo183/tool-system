bounded_closure:
  frozen_before_execution:
    task_identity: P14C-QWEN-AUTH-DIAGNOSTICS-SOURCE-v1
    baseline_commit: 1d0100be219e991fdebc3f138477e948b6517511
    baseline_tree: b1988b14e0a09fb69023eaa991b8a4e4d513c52d
    allowed_scope: exact_12_paths_listed_below
    acceptance_set:
      - the descriptive project-state owner records the consumed failed Qwen attempt from current user evidence without granting authority or accepting P14C
      - HTTP 401 returns stable redacted AUTH_INVALID_KEY while HTTP 403 returns stable redacted ACCESS_FORBIDDEN
      - credential values containing any whitespace fail locally as KEY_INVALID before transport and no key value appears in errors or audit evidence
      - the execution receipt preserves the two new stable classes and retains legacy AUTH_FAILED only for historical evidence compatibility
      - provider endpoint, model, request, approval, source seal, ledger, invocation, budget, retry, fallback, and downstream behavior remain unchanged
      - ai-worker-runtime advances to 1.5.1 while its public interface remains 1.0.0 and registry contract seals remain coherent
      - fake-I/O tests prove the correction without real GitHub approval access, credential-value access, provider invocation, or transport attempt
      - P14C remains unaccepted and P14D, downstream, production, cleanup, rollback, and branch deletion remain unauthorized
    validation_set:
      - focused provider, execution-contract, state, module-registry, and module-contract tests
      - full pytest suite
      - task-manifest, change-plan, process-authority, module-registry, and repository-manifest validators
      - packet-only zero-I/O evidence, source compilation, whitespace, exact-scope, and forbidden-diff checks
    terminal_predicate: all frozen acceptance and validation items pass, one commit is published to one retained feature branch, one Draft PR is created, hosted CI succeeds, and the unchanged PR is moved to Ready and squash-merged without live or downstream I/O
    finite_budgets:
      implementation_cycles: 2
      repair_cycles: 1
      review_cycles: 1
      wall_clock_hours: 4
      real_github_approval_comment_creations: 0
      real_github_approval_reads: 0
      credential_value_accesses: 0
      provider_invocations: 0
      transport_attempts: 0
  per_cycle_state:
    - candidate_tree
    - acceptance_digest
    - blocker_set
    - satisfied_acceptance_items
    - validation_results
    - material_evidence
    - attempt_number
  recurrence_fingerprint:
