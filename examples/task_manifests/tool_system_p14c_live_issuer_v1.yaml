    - python -m compileall src/tool_system tests
    - python -m pytest -q tests/test_p14c_live_issuer.py tests/test_ai_worker_live_provider.py tests/test_process_authority.py tests/test_p14c_execution_contract.py tests/test_phase_alignment.py
