    - python -m tool_system.cli.validate_change_plan examples/change_plans/tool_system_p14c_live_issuer_v1.yaml
    - python -m tool_system.cli.validate_process_authority config/process_authority_v1.yaml
    - python -m tool_system.cli.validate_module_registry config/module_registry_v1.yaml --require-current-authority
    - python -m tool_system.cli.validate_repo_manifest REPO_MANIFEST.md
  pass_conditions:
    - only an internally fetched apolo183 owner comment on apolo183/tool-system can produce a live-network authorization grant
    - the approval body is exact, unedited, short-lived, content-bound, and denies repository mutation, cleanup, P14D, and production
    - the grant and resulting provider capability are immutable, exact-bound, and single-use
    - caller-created mappings, fake readers, expired or edited comments, wrong actors, and replay block before credential or provider transport access
    - all issuer tests use injected HTTP and provider transports with zero real GitHub, credential, or provider access
    - focused tests, full tests, process authority, module registry, and repository manifest pass
