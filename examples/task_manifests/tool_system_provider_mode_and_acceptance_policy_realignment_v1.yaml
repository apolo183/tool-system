bounded_closure:
  frozen_before_execution:
    task_identity: PROVIDER-MODE-AND-ACCEPTANCE-POLICY-REALIGNMENT-v1
    baseline_commit: c4120a8275f6eb8bc8aaa660282b8875b013f1f6
    baseline_tree: b6268cb92b54d46d5166466a87bf6def01fb2c62
    allowed_scope: exact_13_paths_listed_below
    acceptance_set:
      - ChatGPT/Codex subscription mode is the ordinary daily development route and is never treated as API credit or browser-scraped automation
      - every large-model API including OpenAI DeepSeek Qwen and future providers is disabled by default and key presence never grants call authority
      - provider and model selection comes only from repository-external operator configuration and is not hard-coded as a project-completion dependency
      - unconfigured unfunded invalid expired or unavailable providers may be skipped while policy data budget authorization and precondition failures remain non-bypassable
      - every provider-specific adapter requires injected fake-I/O contract tests
      - one explicitly enabled currently usable API key on the then-canonical main is sufficient for the final backup-path smoke proof
      - simultaneous multi-provider availability Qwen funding and moving-alias exact-version pinning are not project-completion gates
      - P15 retains multi-project product evidence and P15D P15F dependency order while P16 API portfolio operations become conditional on API mode
      - the existing disabled operator template credential externalization budgets expiry data transfer retry cancellation audit and Hosted CI fake-I/O boundaries remain unchanged
      - no runtime source module contract provider packet operator configuration CI policy credential provider network target P15 acceptance P16 entry production cleanup or rollback action occurs
    validation_set:
      - blueprint YAML and schema alignment plus provider-mode machine assertions
      - AGENTS README local principles provider economics contract and project-state agreement
      - exact task-pair repository-manifest active-gate process-authority module-registry and full pytest validation
      - Python compilation Ruff diff secret project-identity and exact thirteen-path forbidden-diff checks
      - successful Hosted CI before Ready and squash merge with unchanged base head scope comments and reviews
    terminal_predicate: all acceptance and validation items pass, one Draft PR is published, Hosted CI succeeds, unchanged canonical base head and exact scope move to Ready and squash-merge, the feature branch is retained, and no live or downstream operation occurs
    finite_budgets:
      implementation_cycles: 2
      repair_cycles: 1
      review_cycles: 1
      wall_clock_hours: 8
      official_public_document_reads: 2
      credential_resolver_invocations: 0
      credential_value_accesses: 0
      private_target_reads: 0
      provider_invocations: 0
      live_provider_network_operations: 0
      benchmark_executions: 0
      target_repository_accesses: 0
      target_mutations: 0
      production_operations: 0
      cleanup_operations: 0
      rollback_operations: 0
