    - exact-filter pre-workload-release controls, with fork/vfork positives pidfd-bound inside an execution-owned auxiliary cgroup
    - fail-closed observation-incomplete handling for every SIGBUS, observed positive short result from counted FD-target write ABIs, and pathname-backed quota error
    - bounded synthetic Hosted tests and exact registry and repository-manifest integration
