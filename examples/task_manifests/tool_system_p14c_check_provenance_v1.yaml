verification:
  commands:
    - git diff --check
    - python -m compileall src/tool_system tests
    - python -m pytest -q tests/test_repo_controller.py tests/test_controller_run.py tests/test_controller_self_check.py tests/test_github_state_adapter.py tests/test_live_github_collector.py tests/test_p10r_a_machine_policy_enforcement.py
    - python -m pytest -q
    - python -m tool_system.cli.validate_change_plan examples/change_plans/tool_system_p14c_check_provenance_v1.yaml
    - python -m tool_system.cli.validate_process_authority config/process_authority_v1.yaml
    - python -m tool_system.cli.validate_module_registry config/module_registry_v1.yaml --require-current-authority
    - python -m tool_system.cli.validate_repo_manifest REPO_MANIFEST.md
  pass_conditions:
    - the exact policy-declared required check name and source application are present
    - every admitted check is bound to the current pull-request head SHA
    - missing, duplicate, source-mismatched, stale-head, pending, or failed evidence blocks deterministically
    - success, neutral, and skipped retain GitHub-compatible passing semantics only after provenance and completeness checks pass
    - an unconfigured target repository fails closed
    - the source contains no live repository-action capability issuer
    - focused tests, full tests, process authority, module registry, and repository manifest pass
    - no provider, credential, downstream, cleanup, rollback, or production action occurs
rollback:
