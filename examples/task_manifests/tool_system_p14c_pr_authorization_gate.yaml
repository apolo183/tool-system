task_id: tool-system-p14c-pr-authorization-gate-v1
task_type: code_modify
target_repo: apolo183/tool-system
target_branch: agent/p14c-pr-auth-gate-v1
phase: P14_BLUEPRINT_TO_CODE_AUTONOMOUS_DEVELOPMENT
approved_blueprint_refs:
  - repo: apolo183/tool-system
    path: blueprint/tool_system_v0.yaml
    section_or_key: product_objective
  - repo: apolo183/tool-system
    path: blueprint/tool_system_v0.yaml
    section_or_key: product_objective.required_end_to_end_flow.prepare_separately_authorized_repository_publish_action
alignment:
  parent:
    document: docs/reports/p14c_bounded_real_model_provider_execution.md
    section_or_key: Authority and preconditions
    scope: Correct the repository lifecycle control path before any P14C live proof or acceptance.
  global:
    document: blueprint/tool_system_v0.yaml
    section_or_key: product_objective
    scope: Preserve bounded autonomous development while making repository publication fail closed on missing or stale action authority.
scope:
  summary: Make the repository controller require a separate context-bound lifecycle approval and a single-use mutation capability.
  in_scope:
    - config/module_registry_v1.yaml
    - docs/tool_system_module_registry_contract_v1.md
    - docs/modules/repository-controller-contract-v1.md
    - docs/reports/p14c_pr_authorization_gate.md
    - examples/task_manifests/tool_system_p14c_pr_authorization_gate.yaml
    - examples/change_plans/tool_system_p14c_pr_authorization_gate.yaml
    - src/tool_system/repo_controller/actions.py
    - src/tool_system/repo_controller/controller.py
    - src/tool_system/repo_controller/controller_run.py
    - src/tool_system/repo_controller/github_state.py
    - src/tool_system/repo_controller/live_github_collector.py
    - src/tool_system/repo_controller/self_check.py
    - tests/test_controller_actions.py
    - tests/test_controller_run.py
    - tests/test_controller_self_check.py
    - tests/test_github_state_adapter.py
    - tests/test_live_github_collector.py
    - tests/test_module_registry.py
    - tests/test_p10r_a_machine_policy_enforcement.py
    - tests/test_repo_controller.py
    - tests/test_repo_manifest.py
  out_of_scope:
    - a live repository-action capability issuer
    - treating CI, a task manifest, PR text, or a chat citation as authenticated lifecycle authority
    - PR Ready implementation or execution
    - a real provider call or credential-value access
    - P14C live proof, acceptance, or closure
    - P14D or later-stage work
    - downstream repository access or mutation
    - cleanup, branch deletion, rollback execution, or production deployment
evidence:
  - repo: apolo183/tool-system
    path: src/tool_system/repo_controller/controller.py
    why_relevant: The current merge decision consumes task-manifest approval as lifecycle evidence.
  - repo: apolo183/tool-system
    path: src/tool_system/repo_controller/actions.py
    why_relevant: The current action executor can invoke gh merge after a PASS plan without an independent mutation capability.
  - repo: apolo183/tool-system
    path: docs/modules/repository-controller-contract-v1.md
    why_relevant: The registered natural owner already requires exact action approval and fail-closed stale-state handling.
allowed_files:
  - config/module_registry_v1.yaml
  - docs/tool_system_module_registry_contract_v1.md
  - docs/modules/repository-controller-contract-v1.md
  - docs/reports/p14c_pr_authorization_gate.md
  - examples/task_manifests/tool_system_p14c_pr_authorization_gate.yaml
  - examples/change_plans/tool_system_p14c_pr_authorization_gate.yaml
  - src/tool_system/repo_controller/actions.py
  - src/tool_system/repo_controller/controller.py
  - src/tool_system/repo_controller/controller_run.py
  - src/tool_system/repo_controller/github_state.py
  - src/tool_system/repo_controller/live_github_collector.py
  - src/tool_system/repo_controller/self_check.py
  - tests/test_controller_actions.py
  - tests/test_controller_run.py
  - tests/test_controller_self_check.py
  - tests/test_github_state_adapter.py
  - tests/test_live_github_collector.py
  - tests/test_module_registry.py
  - tests/test_p10r_a_machine_policy_enforcement.py
  - tests/test_repo_controller.py
  - tests/test_repo_manifest.py
forbidden_files:
  - src/tool_system/ai_worker/**
  - src/tool_system/target_repo/**
  - finance/**
  - trading/**
  - market/**
  - portfolio/**
write_mode: pull_request
verification:
  commands:
    - git diff --check
    - python -m compileall src/tool_system tests
    - python -m pytest -q tests/test_repo_controller.py tests/test_controller_actions.py tests/test_controller_run.py tests/test_controller_self_check.py tests/test_github_state_adapter.py tests/test_live_github_collector.py tests/test_p10r_a_machine_policy_enforcement.py
    - python -m pytest -q
    - python -m tool_system.cli.validate_change_plan examples/change_plans/tool_system_p14c_pr_authorization_gate.yaml
    - python -m tool_system.cli.validate_process_authority config/process_authority_v1.yaml
    - python -m tool_system.cli.validate_module_registry config/module_registry_v1.yaml --require-current-authority
    - python -m tool_system.cli.validate_repo_manifest REPO_MANIFEST.md
  pass_conditions:
    - task-manifest approval alone cannot produce a passing repository lifecycle decision
    - repository, pull request, action, base, head, record identity, and approval digest mismatches block deterministically
    - mutation without an exact single-use capability invokes no action runner
    - the source contains no live repository-action capability issuer
    - focused tests, full tests, process authority, module registry, and repository manifest pass
    - no provider, credential, downstream, cleanup, rollback, or production action occurs
rollback:
  method: git_revert
  reference: future P14C-PR-AUTH-GATE-v1 commit
approval:
  required: true
  approved_by: user_standing_tool_system_progress_authority
  approval_source: chat_user_message:these_authorizations_do_not_need_my_approval_proceed
  approved_at: 2026-07-31 UTC+09:00
