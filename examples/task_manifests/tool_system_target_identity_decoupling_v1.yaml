    path: blueprint/tool_system_v0.yaml
    section_or_key: product_objective
  - repo: apolo183/tool-system
    path: blueprint/tool_system_v0.yaml
    section_or_key: milestone_module_invariant.tooling_boundary
scope:
  summary: Remove active downstream project identity coupling from the reusable tool-system target-policy boundary.
  in_scope:
    - Replace downstream repository enums and name-based approval logic with bounded caller-supplied policy inputs.
    - Replace active project-specific target fixtures with a synthetic repository fixture.
    - Preserve retained historical evidence without making it active or authoritative.
    - Record and test the project-neutral public-core invariant.
  out_of_scope:
    - Accessing or mutating any downstream repository.
    - Provider calls, credential values, benchmark execution, production, cleanup, or rollback execution.
    - P15C stage entry or acceptance.
evidence:
  - repo: apolo183/tool-system
    path: docs/tool_system_global_development_principles_v1.md
    why_relevant: Requires reusable components to parameterize repository identity and business context.
  - repo: apolo183/tool-system
    path: policy/repo_write_policy.yaml
    why_relevant: Current public policy serializes downstream repository identities and paths.
  - repo: apolo183/tool-system
    path: src/tool_system/target_repo/p4d_precheck.py
    why_relevant: Current precheck branches on one downstream repository name.
  - repo: apolo183/tool-system
    path: harness/task_manifest.schema.json
    why_relevant: Current schema constrains target_repo to a repository-specific enum.
