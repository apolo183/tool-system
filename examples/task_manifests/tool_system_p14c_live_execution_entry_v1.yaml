      - full pytest suite
      - task-manifest, change-plan, process-authority, module-registry, and repository-manifest validators
      - source compilation, packet-only evidence, whitespace, exact scope, and forbidden-diff checks
    terminal_predicate: all frozen acceptance and validation items pass, one commit is published on the named branch, and one Draft PR targets main without any prohibited real execution
    finite_budgets:
      implementation_cycles: 2
      review_cycles: 1
      wall_clock_hours: 6
