    - PYTHONPATH=src python -m tool_system.cli.validate_task_manifest examples/task_manifests/tool_system_p14c_live_execution_entry_v1.yaml
    - PYTHONPATH=src python -m tool_system.cli.validate_change_plan examples/change_plans/tool_system_p14c_live_execution_entry_v1.yaml
    - PYTHONPATH=src python -m tool_system.cli.validate_process_authority config/process_authority_v1.yaml
    - PYTHONPATH=src python -m tool_system.cli.validate_module_registry config/module_registry_v1.yaml --require-current-authority
    - PYTHONPATH=src python -m tool_system.cli.validate_repo_manifest REPO_MANIFEST.md
    - PYTHONPATH=src PYTHONDONTWRITEBYTECODE=1 python -B -m tool_system.ai_worker.live_evidence --validate-packet-only
  pass_conditions:
    - exact 19-file scope and no blueprint, project-state, live-provider implementation, durable-orchestrator, repository-controller, target-repository, or downstream diff
    - prepare and execute entry behavior is fully covered through injected temporary-ledger and fake-I/O tests
    - packet-only mode still performs zero credential, provider, transport, GitHub, and database access
    - focused tests, full tests, all current validators, source compilation, and diff checks pass
