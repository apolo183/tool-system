scope:
  summary: Freeze DGX Spark Linux ARM64 as the primary target and an ephemeral ARM64 KVM guest as the conditional TS-B02A isolation path without accessing DGX or implementing runtime behavior.
  in_scope:
    - Record the user-owned DGX Spark Linux ARM64 host as the primary intended tool-system execution target.
    - Reclassify the previously selected dedicated Linux x86_64 runner path as non-primary rather than a current implementation prerequisite.
    - Select an ephemeral ARM64 KVM guest on the DGX as the sole current candidate path, conditional on later separately authorized capability proof.
    - Freeze the host, VMM, guest image, guest kernel, storage, network, lifecycle, evidence, and cleanup trust boundaries.
    - Freeze an ARM64-derived identity-sealed network-socket denial filter or equivalent guest-OS control and its DNS, IPv4, IPv6, loopback, netlink, packet, inherited-descriptor, and namespace-bridge adversarial obligations.
    - Preserve the caller-owned IsolationRequestV1 boundary while freezing a provider-owned effective configuration and composite host-plus-guest evidence binding.
    - Freeze a workload-inaccessible one-way bounded evidence channel and a separate hostile-input-safe output parser and extraction lifecycle.
    - Freeze the exact next DGX-local read-only inventory, conditional enablement or acquisition, bounded probe, and subsequent implementation-path re-derivation prerequisites.
    - Freeze host and guest core-dump obligations without authorizing VMM crash injection or host Apport side effects.
    - Preserve Draft PR 231, all blockers, public acceptance state, and the real-execution prohibition.
  out_of_scope:
    - Any access to, command execution on, read from, or modification of the DGX.
    - Installation or configuration of QEMU, libvirt, KVM tooling, packages, groups, permissions, services, kernels, sysctls, cgroups, networks, storage, or images.
    - Creation, boot, mutation, probing, shutdown, reset, or deletion of any virtual machine.
    - Runtime, backend, worker, task-runner, test, workflow, runner, permission, dependency, supply-chain, external-service, or infrastructure implementation.
    - Modification, rebase, merge, close, Ready transition, comment, label, or repair of Draft PR 231.
    - Transfer or reuse of Draft PR 231 implementation authority for ARM64 KVM.
    - TS-B02A implementation, TS-B02B, TS-B02C, TS-B02D, public reacceptance, subscription transport, or any real repository or business workload.
    - Correction of TS-H01, TS-H02, TS-H03, TS-H04, TS-H05, TS-M01, TS-M02, TS-M03, or TS-M04.
