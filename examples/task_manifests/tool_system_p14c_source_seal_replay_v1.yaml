verification:
  commands:
    - git diff --check
    - PYTHONPATH=src PYTHONDONTWRITEBYTECODE=1 python -m compileall -q src/tool_system tests
    - PYTHONPATH=src PYTHONDONTWRITEBYTECODE=1 python -m pytest -q tests/test_p14c_live_issuer.py tests/test_ai_worker_live_provider.py tests/test_durable_orchestrator_state.py tests/test_durable_orchestrator_reliability.py tests/test_durable_orchestrator_side_effects.py tests/test_process_authority.py tests/test_p14c_execution_contract.py tests/test_phase_alignment.py
    - PYTHONPATH=src PYTHONDONTWRITEBYTECODE=1 python -m pytest -q
    - PYTHONPATH=src python -m tool_system.cli.validate_task_manifest examples/task_manifests/tool_system_p14c_source_seal_replay_v1.yaml
    - PYTHONPATH=src python -m tool_system.cli.validate_change_plan examples/change_plans/tool_system_p14c_source_seal_replay_v1.yaml
    - PYTHONPATH=src python -m tool_system.cli.validate_process_authority config/process_authority_v1.yaml
    - PYTHONPATH=src python -m tool_system.cli.validate_module_registry config/module_registry_v1.yaml --require-current-authority
    - PYTHONPATH=src python -m tool_system.cli.validate_repo_manifest REPO_MANIFEST.md
  pass_conditions:
    - approval v2 binds the exact clean execution commit, tree, fixed critical-source manifest, actual host, and durable ledger instance
    - missing, symlinked, dirty, mismatched, or drifted source fails before approval read, credential resolution, or provider transport
    - durable authorization consumption uses one BEGIN IMMEDIATE transaction and an immutable single-host ledger identity
    - two independent processes racing or reopening the same SQLite ledger produce exactly one durable approval-consumption winner
    - a crash after durable claim burns the approval and requires a fresh approval record rather than release or retry
    - the live capability revalidates the exact source seal immediately before every credential access
    - all tests use temporary SQLite and injected GitHub, credential, and provider I/O with zero real external access
    - P14C remains unaccepted and every later-stage, downstream, production, cleanup, rollback, and branch-deletion boundary remains false
    - focused tests, full tests, process authority, module registry, and repository manifest pass
