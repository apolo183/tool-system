    - PYTHONPATH=src python -m tool_system.cli.validate_task_manifest examples/task_manifests/tool_system_p14c_deepseek_recovery_v1.yaml
    - PYTHONPATH=src python -m tool_system.cli.validate_change_plan examples/change_plans/tool_system_p14c_deepseek_recovery_v1.yaml
    - PYTHONPATH=src python -m tool_system.cli.validate_process_authority config/process_authority_v1.yaml
    - PYTHONPATH=src python -m tool_system.cli.validate_module_registry config/module_registry_v1.yaml --require-current-authority
    - PYTHONPATH=src python -m tool_system.cli.validate_repo_manifest REPO_MANIFEST.md
    - PYTHONPATH=src PYTHONDONTWRITEBYTECODE=1 python -B -m tool_system.ai_worker.live_evidence --validate-packet-only
  pass_conditions:
    - exact 13-file closed scope and zero diff under every forbidden path
    - packet-only mode reports the exact DeepSeek snapshot and zero credential, provider, transport, GitHub, and database access
    - local credential tests use only temporary owner-only files and never expose their values in an audit record
    - focused tests, full tests, all current validators, source compilation, and diff checks pass
    - no real GitHub approval read or write, credential-value access, provider call, downstream operation, production operation, cleanup, rollback, or branch deletion occurs during source publication
