    - git diff --check
    - PYTHONPATH=src PYTHONDONTWRITEBYTECODE=1 python -m compileall -q src/tool_system tests
    - PYTHONPATH=src PYTHONDONTWRITEBYTECODE=1 python -m pytest -q tests/test_ai_worker_live_provider.py tests/test_p14c_live_issuer.py tests/test_p14c_execution_contract.py tests/test_phase_alignment.py tests/test_module_registry.py tests/test_module_contracts.py
