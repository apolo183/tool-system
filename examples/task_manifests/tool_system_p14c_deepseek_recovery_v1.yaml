    baseline_tree: 2632892774fe5f6587568349e3d6dbf10410b25e
    allowed_scope: exact_13_paths_listed_below
    acceptance_set:
      - descriptive project state retains the consumed failed Qwen attempt and records DeepSeek as the current unattempted recovery route without granting authority or accepting P14C
      - the single active P14C live adapter is replaced in place by one exact DeepSeek route rather than extended into the P15 provider pool
      - the route binds deepseek-v4-flash and exact POST https://api.deepseek.com/chat/completions with thinking, tools, proxy environment, redirects, retries, and fallback disabled
      - execute resolves only providers.deepseek.api_key from the installation-local owner-only credentials.toml after every existing source, approval, replay, cancellation, request, and budget gate passes
      - one explicit execute allows one provider invocation, one transport attempt, at most 1024 input tokens, 128 output tokens, 1152 total tokens, 25 seconds, and 2000 microUSD of conservative accounting ceiling
      - the request uses DeepSeek OpenAI-compatible JSON Output with an explicit lowercase json instruction, response_format json_object, max_tokens 128, and thinking disabled
      - credential, network, authentication, balance, rate, provider, and rejected-request failures surface as redacted stable classes without silent retry or route escalation
      - packet-only, prepare, fake transport, fake GitHub, credential-file, source-seal, replay, receipt, and module-contract tests perform zero real external or credential access
      - ai-worker-runtime advances to 1.6.0 while its provider-neutral public interface remains 1.0.0 and all registry hashes remain coherent
      - blueprint, process-authority implementation, durable-orchestrator, downstream behavior, production, cleanup, rollback, P14C acceptance, P14D, and P15 runtime remain unchanged
    validation_set:
      - focused P14C provider, issuer, entry, state, module-registry, and module-contract tests
      - full pytest suite
      - task-manifest, change-plan, process-authority, module-registry, and repository-manifest validators
      - packet-only zero-I/O evidence, source compilation, whitespace, exact scope, and forbidden-diff checks
    terminal_predicate: all frozen acceptance and validation items pass, one commit and one Draft PR are published, hosted CI succeeds, and the unchanged exact-scope PR is moved to Ready and squash-merged with its branch retained and no real provider or credential access during publication
    finite_budgets:
      implementation_cycles: 2
      repair_cycles: 1
      review_cycles: 1
      wall_clock_hours: 6
      real_github_approval_comment_creations: 0
      real_github_approval_reads: 0
      credential_value_accesses: 0
      provider_invocations: 0
      transport_attempts: 0
