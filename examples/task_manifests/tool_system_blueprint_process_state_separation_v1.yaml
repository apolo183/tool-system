verification:
  commands:
    - git diff --check
    - python -m pytest -q tests/test_product_objective_alignment.py tests/test_phase_alignment.py tests/test_p14c_execution_contract.py tests/test_p14_phase_entry_contract.py tests/test_milestone_module_invariant.py tests/test_model_provider_portfolio_contract.py tests/test_module_registry.py tests/test_repo_manifest.py tests/test_central_governance_consumption.py
    - python -m pytest -q
    - python -m tool_system.cli.validate_change_plan examples/change_plans/tool_system_blueprint_process_state_separation_v1.yaml
    - python -m tool_system.cli.validate_process_authority config/process_authority_v1.yaml
    - python -m tool_system.cli.validate_module_registry config/module_registry_v1.yaml --require-current-authority
    - python -m tool_system.cli.validate_repo_manifest REPO_MANIFEST.md
  pass_conditions:
    - the blueprint contains only stable target-state, architecture, milestone, boundary, and acceptance-design keys
    - the blueprint contains no current phase, status, acceptance receipt, authorization packet, PR, commit, CI, or branch-disposition block
    - the blueprint schema exact top-level keys match the blueprint and reject extra process-state keys
    - docs/tool_system_project_state_v1.yaml owns descriptive progress state and explicitly grants no authority
    - P14C publication evidence remains in project state and evidence reports without claiming execution or acceptance
    - no runtime, config, policy, harness, provider, credential, downstream, or production file changes
    - focused tests, full tests, process authority, module registry, and repository manifest pass
rollback:
  method: git_revert
  reference: tool-system@20cbb13feb934ce95f2624dafc4510efcd04f1da
approval:
