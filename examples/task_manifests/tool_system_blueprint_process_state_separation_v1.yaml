  global:
    document: blueprint/tool_system_v0.yaml
    section_or_key: product_objective
    scope: Preserve the product objective, capability design, milestone graph, boundaries, and acceptance criteria without changing the intended completed system.
scope:
  summary: Remove project-progress receipts from the blueprint, align its schema to stable target-state keys, and establish one descriptive non-authorizing project-state file.
  in_scope:
    - AGENTS.md
    - README.md
    - REPO_MANIFEST.md
    - blueprint/schema/tool_system_blueprint.schema.json
    - blueprint/tool_system_v0.yaml
    - docs/tool_system_project_state_v1.yaml
    - docs/reports/p14c_bounded_real_model_provider_execution.md
    - docs/reports/p14c_live_issuer_implementation.md
    - docs/tool_system_global_development_principles_v1.md
    - examples/change_plans/tool_system_blueprint_process_state_separation_v1.yaml
    - examples/task_manifests/tool_system_blueprint_process_state_separation_v1.yaml
    - tests/test_central_governance_consumption.py
    - tests/test_milestone_module_invariant.py
    - tests/test_model_provider_portfolio_contract.py
    - tests/test_module_registry.py
    - tests/test_p14_phase_entry_contract.py
    - tests/test_p14c_execution_contract.py
    - tests/test_phase_alignment.py
    - tests/test_product_objective_alignment.py
    - tests/test_repo_manifest.py
  out_of_scope:
    - changing the product objective, module architecture, milestone sequence, stage objectives, or acceptance criteria
    - modifying runtime, provider, process-authority, repository-controller, policy, harness, or downstream source
    - creating or editing a real GitHub approval record
    - credential-value access, live capability issuance, or a real provider call
    - P14C execution, acceptance, or closure
    - P14D or later-stage work
    - downstream repository access or mutation
    - PR Ready, main merge, branch deletion, destructive cleanup, rollback, or production
evidence:
  - repo: apolo183/tool-system
    path: blueprint/tool_system_v0.yaml
    commit_sha: 20cbb13feb934ce95f2624dafc4510efcd04f1da
    why_relevant: The current main blueprint mixes stable target design with current phase, authorization, PR, commit, CI, and branch-state receipts.
  - repo: apolo183/tool-system
    path: blueprint/schema/tool_system_blueprint.schema.json
    commit_sha: 20cbb13feb934ce95f2624dafc4510efcd04f1da
    why_relevant: The schema claims a closed top-level blueprint contract but is stale relative to the actual stable blueprint keys and does not govern the mixed process-state blocks.
  - repo: apolo183/tool-system
    path: docs/tool_system_global_development_principles_v1.md
    commit_sha: 20cbb13feb934ce95f2624dafc4510efcd04f1da
    why_relevant: The documented hierarchy places execution evidence below the blueprint, milestone, manifest, and change plan rather than inside the blueprint.
