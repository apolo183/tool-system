bounded_closure:
  frozen_before_execution:
    task_identity: P14G-DURABLE-LOCAL-GIT-LIFECYCLE-v1
    baseline_commit: 22dedb0f2a2c0b38a0bd4c67f36c1c2454ca19d5
    baseline_tree: 9cc451780afbcd5a3dcc184e05d2fa9fbd2dff09
    allowed_scope: exact_22_paths_listed_below
    acceptance_set:
      - local-git 1.0.0 and local-git-api 1.0.0 are registered as one replaceable natural owner consuming development-loop-api and durable-orchestrator-api
      - preflight requires an absolute clean non-symlink repository root with no configured remote and exact base commit and tree
      - the P14F candidate must be sealed and contain exactly the frozen path scope before any candidate content is staged
      - durable run task lease attempt checkpoint branch effect and commit effect records bind the local Git workflow to the exact base
      - one local agent branch and one commit are created only after frozen validation and review pass
      - a crash after a completed durable commit receipt resumes without a duplicate commit while ambiguous in-progress effects block
      - staged paths must exactly equal frozen scope and symlink or non-regular existing candidate paths block
      - rollback creator-cleanup and draft-PR outputs are non-executing plans and remote provider credential downstream and production operations remain zero
      - the sole descriptive project-state owner records P14G accepted and P14H as the unauthorized next stage
      - blueprint principles provider code repository controller target adapters and downstream repositories remain unchanged
    validation_set:
      - focused local-git module-registry module-contract import-graph repository-manifest and phase-state tests
      - full pytest suite
      - task-manifest change-plan process-authority module-registry and repository-manifest validators
      - source compilation whitespace exact-scope and forbidden-diff checks
    terminal_predicate: all frozen acceptance and validation items pass, one commit and one Draft PR are published, hosted CI succeeds, the unchanged exact-scope PR is moved to Ready and squash-merged, the feature branch is retained, canonical main records P14G accepted, and execution stops with P14H unauthorized
    finite_budgets:
      implementation_cycles: 2
      repair_cycles: 1
      review_cycles: 1
      wall_clock_hours: 8
      fixture_local_git_commits_per_test: 2
      real_downstream_repository_accesses: 0
      credential_value_accesses: 0
      provider_invocations: 0
      remote_git_operations: 0
  per_cycle_state: [candidate_tree, acceptance_digest, blocker_set, satisfied_acceptance_items, validation_results, material_evidence, attempt_number]
  recurrence_fingerprint: [task_identity, candidate_tree, acceptance_digest, blocker_set, validation_results]
  recurrence_fingerprint_excludes: [attempt_number, timestamps, receipts, pull_request_metadata, status_text]
