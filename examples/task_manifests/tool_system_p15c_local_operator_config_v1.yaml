verification:
  commands:
    - git diff --check
    - PYTHONPATH=src PYTHONDONTWRITEBYTECODE=1 python -m compileall -q src/tool_system tests
    - PYTHONPATH=src PYTHONDONTWRITEBYTECODE=1 python -m pytest -q tests/test_ai_worker_p15c_controls.py tests/test_ai_worker_p15c_benchmark.py tests/test_ai_worker_p15c_entry.py tests/test_p15c_local_operator_config.py tests/test_module_registry.py tests/test_module_contracts.py tests/test_repo_manifest.py
    - PYTHONPATH=src PYTHONDONTWRITEBYTECODE=1 python -m pytest -q
    - PYTHONPATH=src python -m tool_system.cli.validate_task_manifest examples/task_manifests/tool_system_p15c_local_operator_config_v1.yaml
    - PYTHONPATH=src python -m tool_system.cli.validate_change_plan examples/change_plans/tool_system_p15c_local_operator_config_v1.yaml
    - PYTHONPATH=src python -m tool_system.cli.validate_active_gates examples/active_gates.yaml
    - PYTHONPATH=src python -m tool_system.cli.validate_process_authority config/process_authority_v1.yaml
    - PYTHONPATH=src python -m tool_system.cli.validate_module_registry config/module_registry_v1.yaml --require-current-authority
    - PYTHONPATH=src python -m tool_system.cli.validate_repo_manifest REPO_MANIFEST.md
    - PYTHONPATH=src PYTHONDONTWRITEBYTECODE=1 python -B -m tool_system.ai_worker.p15c_entry --packet-only
  pass_conditions:
    - exact nineteen-file diff and zero workflow blueprint frozen-packet provider-route target or fixture change
    - public examples contain empty credentials and disabled provider and transfer switches
    - default private paths remain outside the repository and all private files require owner-only permissions
    - Hosted workflows contain no OpenAI DeepSeek Qwen or P15C private-bundle Secret reference and no live P15C execute command
    - all tests and validators pass without credential resolution provider network target access or benchmark execution
