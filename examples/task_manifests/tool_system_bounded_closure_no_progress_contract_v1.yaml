write_mode: pull_request
verification:
  commands:
    - git diff --check
    - PYTHONPATH=src PYTHONDONTWRITEBYTECODE=1 python -m pytest -q tests/test_phase_alignment.py tests/test_product_objective_alignment.py tests/test_repo_manifest.py
    - PYTHONPATH=src PYTHONDONTWRITEBYTECODE=1 python -m pytest -q
    - PYTHONPATH=src python -m tool_system.cli.validate_task_manifest examples/task_manifests/tool_system_bounded_closure_no_progress_contract_v1.yaml
    - PYTHONPATH=src python -m tool_system.cli.validate_change_plan examples/change_plans/tool_system_bounded_closure_no_progress_contract_v1.yaml
    - PYTHONPATH=src python -m tool_system.cli.validate_process_authority config/process_authority_v1.yaml
    - PYTHONPATH=src python -m tool_system.cli.validate_module_registry config/module_registry_v1.yaml --require-current-authority
    - PYTHONPATH=src python -m tool_system.cli.validate_repo_manifest REPO_MANIFEST.md
  pass_conditions:
    - no new P14 stage or progress-state field is introduced
    - frozen closure includes task, baseline, scope, acceptance, validation, terminal predicate, and finite budgets but excludes candidate tree
    - candidate tree and attempt number remain per-cycle state while attempt number and bookkeeping are excluded from recurrence fingerprints
    - repeated state, two non-progress cycles, or finite budget exhaustion terminates rather than creating new work
    - evidence and PR metadata cannot create or reopen acceptance obligations outside the frozen set
    - crash recovery does not duplicate task, branch, commit, or pull request
    - exact seven-file scope passes focused, full, and repository contract validation
    - runtime source, project state, provider, credential, repository controller, and downstream behavior remain unchanged
publication:
