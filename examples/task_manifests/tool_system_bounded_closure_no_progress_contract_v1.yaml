alignment:
  parent:
    document: docs/tool_system_global_development_principles_v1.md
    section_or_key: Bounded closure and no-progress
    scope: Freeze finite closure and termination semantics without introducing a new stage or runtime implementation.
  global:
    document: blueprint/tool_system_v0.yaml
    section_or_key: product_objective
    scope: Prevent self-generated acceptance loops while preserving the permanent bounded blueprint-to-code objective.
scope:
  summary: Strengthen the existing P14F and P14H target-state contracts with frozen acceptance, finite budgets, no-progress termination, and evidence non-reopening semantics.
  in_scope:
    - docs/tool_system_global_development_principles_v1.md
    - blueprint/tool_system_v0.yaml
    - tests/test_phase_alignment.py
    - tests/test_product_objective_alignment.py
    - tests/test_repo_manifest.py
    - examples/task_manifests/tool_system_bounded_closure_no_progress_contract_v1.yaml
    - examples/change_plans/tool_system_bounded_closure_no_progress_contract_v1.yaml
  out_of_scope:
    - runtime or source implementation
    - project-state progress changes
    - provider, credential, or repository-controller behavior
    - P14C live execution or acceptance
    - P14D or later implementation
    - downstream repository operations
    - PR Ready, Review, or merge
    - cleanup, rollback execution, or branch deletion
evidence:
  - repo: apolo183/finance-governance
    path: docs/global_development_principles_v1.md
    why_relevant: Canonical bounded-closure semantics freeze baseline rather than candidate state, exclude bookkeeping from recurrence, and terminate finite no-progress cycles.
  - repo: apolo183/tool-system
    path: docs/tool_system_global_development_principles_v1.md
    commit_sha: 44a8250a3ce922ecd7575e70f35eb7df9312b072
    why_relevant: The natural owner lacks the canonical bounded-closure and evidence non-reopening contract.
  - repo: apolo183/tool-system
    path: blueprint/tool_system_v0.yaml
    commit_sha: 44a8250a3ce922ecd7575e70f35eb7df9312b072
    why_relevant: Existing P14F and P14H are the stable target-state owners to strengthen without adding a stage.
  - repo: apolo183/tool-system
    path: tests/test_repo_manifest.py
    commit_sha: 44a8250a3ce922ecd7575e70f35eb7df9312b072
    why_relevant: The retained-path assertion uses a brittle literal count and must prove the exact authorization pair remains classified.
allowed_files:
  - docs/tool_system_global_development_principles_v1.md
  - blueprint/tool_system_v0.yaml
  - tests/test_phase_alignment.py
  - tests/test_product_objective_alignment.py
  - tests/test_repo_manifest.py
