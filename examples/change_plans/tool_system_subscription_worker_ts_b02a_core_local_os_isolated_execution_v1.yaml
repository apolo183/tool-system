  - freeze the Linux v6.18 native x86_64 syscall ABI at audited range 0 through 469 and exclusive ceiling 470, bind the number into the exact cBPF identity, and require direct syscall 470 EPERM evidence before release and in the Hosted workload
  - enforce a private mount PID network IPC and UTS namespace composition with recursive private propagation pivot_root and quota-bound private filesystems
  - seal executable script interpreter and loader identities through descriptor-backed selection openat2 execveat ptrace exec observation and mismatch denial
  - enforce unprivileged UID GID empty supplementary groups zero effective capabilities no_new_privs default-deny network inherited-descriptor closure and keyring/core-dump denial
  - deny pathless memfd resources legacy and at-family xattr mutation open_tree_attr file_setattr host-inode locks leases write hints delegation filesystem-wide and quota sync every ioctl shared legacy futex and futex2 membarrier same-UID host priority access system-wide perf events keyring controls F_SETFL packet or notification pipes and other frozen provider controls
  - bind the complete process tree to one execution cgroup, acknowledge and retain pidfd-bound historical members before ordinary exits resume, cap the historical/live union including two fixed provider supervisors, and terminate through pidfd and cgroup.kill
  - drain stdout and stderr incrementally as raw bytes through OS-read-back 4096-byte pipes, enforce 4097/8193 final overshoot bounds, kill limits immediately from a frozen cgroup, and preserve the full requested grace for non-limit outcomes
  - deny secondary exec and shared VM filesystem file-table signal-handler clone state while preserving ordinary fork vfork and parent wait semantics
  - freeze stream pipe capacity and process resource limits by denying F_SETPIPE_SZ setrlimit and prlimit64 after setup
  - set RLIMIT_FSIZE to the larger scratch/file-output byte limit and accept EFBIG only from an FD-bound exact matching target scope and syscall ABI; pathname-backed failures never form complete LIMIT evidence
  - execute exact-filter controls before workload release, run fork and vfork positives inside an execution-owned auxiliary cgroup after pidfd binding, and freeze the truthful outer-supervisor scope
  - force observation-incomplete evidence for every SIGBUS and any observed positive short result from counted FD-target write ABIs, with no complete LIMIT or SUCCESS promotion
  - preserve private-workload fsync fdatasync msync page-cache atime and host-I/O scheduling effects as explicit non-claims rather than absolute zero-effect conclusions
  - emit only current-run OS-derived ExecutionEvidenceV1 with ordered causality observation-loss handling and cleanup-completeness precedence
  - bind identity.seal to openat2 fstat SHA-256 and memfd-seal provenance and keep exec.ptrace separately bound to ptrace and procfs provenance
  - exercise the frozen adversarial matrix with bounded synthetic fixtures only and report NOT_EXECUTED outside identified GitHub Hosted capability conditions
