implementation_order:
  - Freeze the stable blueprint and public policy boundary.
  - Make schema and precheck policy-driven without changing public function signatures.
  - Add synthetic target inputs and migrate active tests away from retained fixtures.
  - Register the exact formal topology and descriptive state.
  - Run local validation, publish one Draft PR, verify Hosted CI and no drift, then squash merge and retain the branch.
