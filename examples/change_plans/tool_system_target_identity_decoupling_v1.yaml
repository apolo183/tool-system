plan_id: tool-system-target-identity-decoupling-v1
target_repo: apolo183/tool-system
task_manifest: examples/task_manifests/tool_system_target_identity_decoupling_v1.yaml
baseline:
  canonical_commit: 5e964adfd40502a3798630b98fb0d876bbd01d91
  canonical_tree: 440a95606e964ce3477eab6e3e427b51df64c54a
  drift_required: identical
bounded_closure:
  task_identity: TARGET-IDENTITY-DECOUPLING-v1
  allowed_scope_digest_input: exact changed_files list in this plan
  acceptance_set:
    - Public schema accepts bounded owner/repository identities without an enumerated downstream project.
    - Public repository policy contains tool-system self-policy only; external target rules are injected inputs.
    - Target precheck derives approval requirements from the selected repository policy and fails closed by default.
    - Active target-adapter tests use only a synthetic repository fixture.
    - Retained non-authority evidence remains byte-preserved and excluded from current authority.
    - P15C remains unauthorized and no provider, credential, network, benchmark, downstream, cleanup, rollback, or production operation occurs.
  validation_set:
    - focused pytest
    - full pytest
    - Ruff
    - repository manifest validator
    - active formal-file downstream identity scan
  terminal_predicate: All acceptance and validation items pass on one no-drift Draft PR and Hosted CI succeeds.
  finite_budgets:
    repair_cycles: 3
    review_cycles: 2
    time_minutes: 180
    external_cost_usd: 0
