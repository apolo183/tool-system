  - Freeze the user-owned DGX Spark Linux ARM64 host as the primary intended deployment target; record that the parent left its Linux x86_64 runner provider unknown and do not misclassify it as an existing cloud route.
  - Reclassify the earlier dedicated ephemeral Linux x86_64 runner selection as a non-primary optional alternative rather than an accepted or implemented path.
  - Select an ephemeral ARM64 KVM guest on the DGX as the sole current conditional candidate for TS-B02A path closure.
  - Freeze the trusted-host boundary and bind future evidence to DGX host identity, boot identity, kernel identity, KVM device access, VMM binary and configuration, guest image, guest kernel and initrd, root filesystem, storage topology, network topology, and VM lifecycle.
  - Require the future guest path to preserve filesystem isolation, complete process-tree containment and cleanup, default-deny network, executable/interpreter/loader sealing, TOCTOU resistance, raw streaming output limits, monotonic timeout termination, and matching current-run OS-derived evidence.
  - Require default-deny networking to combine absent guest and host network devices and backends with an ARM64-derived identity-sealed seccomp filter or equivalent guest-OS denial of DNS, IPv4, IPv6, loopback, netlink, packet, inherited-network-descriptor, and network-namespace or bridge operations before the first workload instruction.
  - Keep IsolationRequestV1 caller-owned and freeze TS-B02A ownership of a sealed provider-effective configuration containing actual host boot, KVM, VMM, firmware, guest image, device, cgroup, channel and overlay identities.
  - Require a bounded one-way workload-inaccessible guest-supervisor evidence channel distinct from stdout and stderr, and bind nonce, request, boot, provider, sequence and completeness.
  - Freeze a quiesce, detach, bounded hostile-input-safe parse and extract, validate, cleanup or quarantine, then final-evidence output lifecycle; prohibit ordinary live host mounts of guest filesystems.
  - Freeze guest post-exec descendant core limits and restoration denial plus mandatory exact host-provider pipe-handler observation; do not authorize VMM crash injection or Apport side effects.
  - Freeze no host-directory sharing, no uncontrolled host-device passthrough, no ordinary-host fallback, and no application-created absolute zero-effect or hard-zero conclusions.
  - Freeze the future pre-release gates for actual KVM access, installed VMM identity and license, ARM64 acceleration, guest non-pipe core_pattern, cgroup v2, namespace and mount features, storage quotas, disconnected networking, evidence completeness, and verified VM destruction or reset.
  - Freeze the exact first next task as a separately authorized read-only DGX-local hypervisor, candidate-image, cgroup, security-policy, and permission inventory returned to and explicitly accepted by the user; do not execute or delegate it from this package.
  - Require one or more exact separately authorized enablement or acquisition packages and read-only re-verification if inventory finds any missing prerequisite; inventory itself authorizes no mutation or candidate image.
  - Freeze the bounded synthetic ephemeral-guest capability and path-closure probe as ineligible until inventory and every conditional prerequisite are explicitly accepted.
  - Require a fresh exact ARM64 KVM implementation closure from the then-current canonical base after an accepted probe; do not transfer the stopped 17-path PR 231 authority.
  - Preserve Draft PR 231 without update, rebase, merge, close, Ready transition, comment, label, or branch mutation.
  - Preserve TS-B01 corrected_pending_reacceptance, TS-B02 blocking, public-entry unreaccepted, real-repository execution blocked, and every listed TS-H and TS-M finding.
  - Publish only the exact three non-authority additions and stop without accessing DGX or starting TS-B02A.
