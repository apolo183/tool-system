    scope: Repair only the observed P14G lease and pre-dispatch durable-call accounting defect while preserving the accepted public-entry authority boundary.
  global:
    document: blueprint/tool_system_v0.yaml
    section_or_key: product_objective
    scope: Preserve finite crash-resumable subscription-primary worker execution and one bounded remote-free local commit without duplicating external work.
implementation:
  - migrate the durable SQLite owner to schema v4 with an append-only ordinal worker-call ledger and active-lease renewal operation
  - wrap every local-Git-owned worker dispatch with durable pre-dispatch consumption and bounded redacted completion while reconciling retry-wide call counts into the development loop
  - derive the public lease from frozen worker termination validation and local-Git process budgets and renew it only at controlled callback and commit-stage boundaries
  - expose stable adapter terminal codes and preserve them with durable total call counts across blocked and conflicting result paths
  - add only deterministic fake-process fake-clock timeout lease-expiry crash-recovery and budget tests and update the corresponding contracts state report registry and manifest
