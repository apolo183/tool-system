name: tool-system-ci

on:
  pull_request:
  push:
    branches:
      - main
      - p*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify installed wheel from sdist outside checkout
        run: python -m pytest -q tests/test_installed_manifest.py

      - name: Run remaining tests
        run: python -m pytest -q --ignore=tests/test_installed_manifest.py

      - name: Validate active gates
        run: python -m tool_system.cli.validate_active_gates tests/fixtures/manifest_validation/strict_active_gates_v1.yaml

      - name: Validate process authority
        run: python -m tool_system.cli.validate_process_authority config/process_authority_v1.yaml

      - name: Require current module registry authority
        run: python -m tool_system.cli.validate_module_registry config/module_registry_v1.yaml --require-current-authority

      - name: Validate repository manifest
        run: python -m tool_system.cli.validate_repo_manifest REPO_MANIFEST.md
